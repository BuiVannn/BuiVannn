name: Generate contribution snake

on:
  schedule:
    # Chay moi ngay luc 00:00 UTC (07:00 gio Viet Nam)
    - cron: "0 0 * * *"
  # Cho phep bam nut chay tay trong tab Actions
  workflow_dispatch:
  # Chay lai moi khi push len nhanh main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%2300ffe7&color_dots=%23241040,%235c1030,%23a3123f,%23d9184a,%23ff1973
            dist/snake-dark.svg?color_snake=%2300ffe7&color_dots=%23241040,%235c1030,%23a3123f,%23d9184a,%23ff1973

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
