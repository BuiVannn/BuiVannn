name: Generate contribution snake

on:
  schedule:
    # Chay moi ngay luc 00:00 UTC (07:00 gio Viet Nam)
    - cron: "0 0 * * *"
  # Cho phep bam nut chay tay trong tab Actions
  workflow_dispatch:
  # Chay lai moi khi push len nhanh main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Bang mau chuoi da qua validator (dataviz): mot tong, do sang tang deu,
          # giam bao hoa de luoi lui ra sau -- ran do moi la thu noi len.
          # Ban cu bao hoa cao lam do va xanh cung do sang -> rung mau, moi mat.
          outputs: |
            dist/snake.svg?color_snake=%23df1f2d&color_dots=%23eef0f6,%23a8b3ce,%238494bb,%235f739f,%233d5183
            dist/snake-dark.svg?color_snake=%23df1f2d&color_dots=%23171d2e,%233d4a6b,%2352648f,%236a7fb3,%238599d8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
