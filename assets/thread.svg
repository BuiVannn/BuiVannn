<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 104" width="60" height="104" role="img" aria-label="">
<defs><style>
.t{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.knot{animation:kfade .6s ease-out both;animation-delay:.9s}
@keyframes kfade{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}
  .t{stroke-dashoffset:0}}
</style></defs>
<path class="t" pathLength="1" d="M30 0Q33 26 30 52Q27 78 30 104" fill="none" stroke="#447bbe" stroke-width="1.5" opacity=".75"/>
<g class="knot" transform="translate(30,52)" style="transform-origin:30px 52px">
<path d="M-11 0Q0 -6 11 0Q0 6 -11 0Z" fill="none" stroke="#447bbe" stroke-width="1" opacity=".6"/>
<circle r="2.6" fill="#df1f2d"/>
</g>
</svg>